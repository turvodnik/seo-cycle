name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint (errors, undefined names, unused imports/vars, bugbear)
        run: ruff check --select E9,F63,F7,F82,F401,F841,B,PLE scripts/ tests/

  typecheck-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: python -m pip install --quiet -e ".[dev]"
      - name: mypy on the core package
        run: mypy scripts/seo_cycle_core --ignore-missing-imports

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (error severity)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh install.sh install-codex.sh bootstrap-claude.sh bootstrap-codex.sh

  coverage-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project (dev extras + google-nlp-audit.py's optional deps, R2-5 T-066 круг 3 — иначе test_google_nlp_ledger.py целиком пропускается)
        run: python -m pip install --quiet -e ".[dev]" requests beautifulsoup4 google-auth
      - name: In-process coverage of seo_cycle_core (subprocess-driven tests not counted)
        run: |
          coverage run --source=scripts/seo_cycle_core -m unittest discover -s tests
          coverage report --fail-under=50

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (dev extras + google-nlp-audit.py's optional deps, R2-5 T-066 круг 3 — иначе test_google_nlp_ledger.py целиком пропускается)
        run: python -m pip install --quiet -e ".[dev]" requests beautifulsoup4 google-auth
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Strict config-schema validation of the template (informational)
        run: python scripts/validate-config.py config/project.template.yaml --strict || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Secret scan (bare Python — base mode needs no PyYAML, no install step)
        run: python scripts/secret-scan.py . --format json
