# =============================================================================
# projects-registry.yaml — индекс всех проектов под seo-cycle
# =============================================================================
# Один реестр на все проекты пользователя. monthly-runner.sh --all итерирует
# по нему; init-project.sh дозаписывает сюда новый проект автоматически.
#
# Поля проекта:
#   name           — человеческое имя
#   path           — абсолютный путь к корню проекта (где лежит seo-cycle.yaml)
#   region_profile — ru | eu | us | global
#   cms            — wordpress | shopify | nextjs | static | ...
#   status         — active | paused | archived
#   monthly_automation — true/false (участвует ли в monthly-runner --all)

projects:
  - name: "Эмвуди"
    path: "/Users/pifagor/Проекты ai/emwoody.ru"
    region_profile: ru
    cms: wordpress
    status: active
    monthly_automation: true
  # Перенесён на Mac Studio 2026-07-29 (папка 3Dprint → pifagorlab.com).
  # monthly_automation остаётся false до решения владельца: сайт молодой,
  # месячный прогон включать имеет смысл после накопления GSC-данных.
  - name: "PifagorLab"
    path: "/Users/pifagor/Проекты ai/pifagorlab.com"
    region_profile: eu
    cms: static
    status: active
    monthly_automation: false
  - name: "ГРАДСТРОЙСЕРВИС"
    path: "/Users/pifagor/Проекты ai/gsse.ru"
    region_profile: ru
    cms: wordpress
    status: active
    monthly_automation: false
